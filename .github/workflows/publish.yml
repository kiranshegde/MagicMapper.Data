name: Build and Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
          NUGET_CERT_REVOCATION_MODE: offline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore MagicMapper.Data.sln

      - name: Build
        run: dotnet build MagicMapper.Data.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test MagicMapper.Data.sln --configuration Release --no-build

      - name: Pack
        run: dotnet pack MagicMapper.Data/MagicMapper.Data.csproj --configuration Release --no-build --output ./artifacts

      - name: NuGet Login (Trusted Publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: kiranshegde

      - name: Publish packages
        run: |
          find ./artifacts -name "*.nupkg" ! -name "*.snupkg" \
            -exec dotnet nuget push {} \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate \;

      - name: Publish symbol packages
        run: |
          find ./artifacts -name "*.snupkg" \
            -exec dotnet nuget push {} \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate \;

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg