name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore MagicMapper.Data.sln

      - name: Build
        run: dotnet build MagicMapper.Data.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test MagicMapper.Data.sln --configuration Release --no-build